name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: ./gradlew --no-daemon build compileGametestJava
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ender-link-client
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
